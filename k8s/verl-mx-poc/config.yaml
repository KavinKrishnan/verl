apiVersion: v1
kind: ConfigMap
metadata:
  name: verl-mx-config
  namespace: kavin
data:
  run_ppo.sh: |
    #!/bin/bash
    set -e

    # Diagnostic
    python3 -c "import torch; print('torch:', torch.__version__, 'cuda:', torch.cuda.is_available(), 'devices:', torch.cuda.device_count() if torch.cuda.is_available() else 0)"

    # Start Ray head on this node
    ray start --head --port=6379 --dashboard-host=0.0.0.0

    # Prepare dataset
    python3 /config/prep_data.py

    # Wait for workers to join
    sleep 15

    # Run verl PPO training with MX checkpoint engine
    python3 -m verl.trainer.main_ppo \
      algorithm.adv_estimator=grpo \
      'data.train_files=[/tmp/gsm8k_verl.parquet]' \
      'data.val_files=[/tmp/gsm8k_verl.parquet]' \
      data.train_batch_size=16 \
      data.max_prompt_length=256 \
      data.max_response_length=256 \
      data.filter_overlong_prompts=True \
      data.truncation=error \
      actor_rollout_ref.model.path=Qwen/Qwen2.5-1.5B \
      actor_rollout_ref.actor.optim.lr=1e-6 \
      actor_rollout_ref.actor.ppo_mini_batch_size=16 \
      actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=4 \
      actor_rollout_ref.actor.ppo_epochs=1 \
      actor_rollout_ref.actor.use_kl_loss=False \
      actor_rollout_ref.actor.entropy_coeff=0 \
      actor_rollout_ref.model.enable_gradient_checkpointing=True \
      actor_rollout_ref.actor.fsdp_config.param_offload=False \
      actor_rollout_ref.actor.fsdp_config.optimizer_offload=False \
      actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=4 \
      actor_rollout_ref.rollout.tensor_model_parallel_size=1 \
      actor_rollout_ref.rollout.name=vllm \
      actor_rollout_ref.rollout.gpu_memory_utilization=0.5 \
      actor_rollout_ref.rollout.n=1 \
      actor_rollout_ref.rollout.enforce_eager=True \
      actor_rollout_ref.rollout.enable_chunked_prefill=True \
      actor_rollout_ref.rollout.max_num_batched_tokens=2048 \
      actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=4 \
      actor_rollout_ref.ref.fsdp_config.param_offload=False \
      algorithm.use_kl_in_reward=False \
      trainer.critic_warmup=0 \
      trainer.total_epochs=1 \
      trainer.n_gpus_per_node=4 \
      trainer.nnodes=1 \
      trainer.save_freq=-1

  prep_data.py: |
    from datasets import load_dataset, Dataset
    ds = load_dataset("openai/gsm8k", "main", split="train[:256]")
    rows = []
    for row in ds:
        rows.append({
            "prompt": [{"role": "user", "content": row["question"]}],
            "reward_model": {"ground_truth": row["answer"]},
            "data_source": "openai/gsm8k",
        })
    out = Dataset.from_list(rows)
    out.to_parquet("/tmp/gsm8k_verl.parquet")
    print("Dataset saved:", len(out), "rows")
